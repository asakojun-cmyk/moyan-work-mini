<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>もやんちゃん｜ご相談の予約</title>
<meta name="robots" content="noindex" />
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --cream:#fffdf2; --sky:#f5e9e7; --ink:#000030; --marker:#ffdd7a;
  --blue:#C6A09B; --white:#fff; --ink-60:rgba(0,0,48,.6); --ink-45:rgba(0,0,48,.4);
  --line:rgba(198,160,155,.16); --button-line:rgba(198,160,155,.36);
  --soft-shadow:0 10px 28px rgba(198,160,155,.1);
  --font-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1); --maxw:430px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#e9edf3}
body{margin:0;color:var(--ink);font-family:var(--font-round);line-height:1.7;background:#e9edf3}
button{font:inherit;cursor:pointer;color:inherit}
.app{position:relative;width:100%;max-width:var(--maxw);margin:0 auto;min-height:100svh;min-height:100dvh;
  background:linear-gradient(180deg,var(--sky) 0%,#faf1ef 30%,var(--cream) 55%);padding:20px 20px 40px}
@media (min-width:640px){.app{margin:18px auto;min-height:auto;border-radius:30px;box-shadow:0 0 60px rgba(20,40,70,.12)}}

h1{font-size:16px;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--ink-60);margin:0 0 18px}

.card{background:var(--white);border-radius:18px;box-shadow:var(--soft-shadow);padding:16px;margin:0 0 16px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--blue)}
.svc-desc{font-size:13px;color:var(--ink-60);line-height:1.75;margin:0 0 12px}
.price-row{display:flex;justify-content:space-between;font-size:12.5px;background:var(--cream);
  border-radius:12px;padding:9px 12px;margin-bottom:6px}
.price-row b{font-size:15px}

details{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;background:var(--sky)}
summary::-webkit-details-marker{display:none}
summary .cnt{font-size:11.5px;color:var(--blue);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:12px}
.slot{position:relative}
.slot input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.slot label{display:block;text-align:center;padding:9px 4px;border-radius:10px;border:1px solid var(--button-line);
  font-size:12.5px;font-weight:700;background:var(--white)}
.slot input:checked + label{background:var(--blue);color:#fff;border-color:var(--blue)}

label.field{display:block;font-size:12px;font-weight:700;color:var(--ink-60);margin:0 0 4px}
.field-wrap{margin-bottom:12px}
input[type=text],input[type=email],input[type=tel],textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--button-line);
  font-family:inherit;font-size:14px;background:var(--white)}
textarea{resize:vertical;min-height:64px}

.btn{display:block;width:100%;min-height:52px;padding:12px 18px;border:none;border-radius:999px;
  background:var(--blue);color:#fff;font-family:var(--font-round);font-size:15px;font-weight:800;
  box-shadow:0 8px 24px rgba(198,160,155,.18)}
.btn:disabled{background:#ececdf;color:#a9a79a}
.btn:active:not(:disabled){transform:scale(.98)}

.note{font-size:11.5px;color:var(--ink-45);margin-top:10px;line-height:1.7}
.state-msg{text-align:center;font-size:13px;color:var(--ink-60);padding:24px 0}
.error-msg{text-align:center;font-size:13px;color:#b3413a;padding:12px 0}

.confirm-card{text-align:center}
.confirm-card h2{font-size:16px;color:var(--ink);margin:0 0 10px}
.confirm-card .meet-link{display:inline-block;margin:12px 0;padding:10px 18px;border-radius:999px;
  background:var(--sky);color:var(--blue);font-weight:800;font-size:13.5px;text-decoration:none;word-break:break-all}
</style>
</head>
<body>
<div class="app">
  <h1>もやんちゃんの予約</h1>
  <p class="sub">こんにちは☺️キャリアカウンセラーの岩脇朝子です。ご相談のご希望のお日にちをお伺いします。</p>

  <div id="serviceCard" class="card">
    <p class="state-msg">読み込んでいます…</p>
  </div>

  <div id="scheduleCard" class="card" style="display:none">
    <h2>日時を選ぶ</h2>
    <div id="scheduleList"></div>
  </div>

  <div id="formCard" class="card" style="display:none">
    <h2>ご連絡先</h2>
    <div class="field-wrap">
      <label class="field" for="fName">お名前</label>
      <input type="text" id="fName" autocomplete="name" required />
    </div>
    <div class="field-wrap">
      <label class="field" for="fEmail">メールアドレス（Google Meetのご案内をお送りします）</label>
      <input type="email" id="fEmail" autocomplete="email" required />
    </div>
    <div class="field-wrap">
      <label class="field" for="fPhone">電話番号（任意）</label>
      <input type="tel" id="fPhone" autocomplete="tel" />
    </div>
    <div class="field-wrap">
      <label class="field" for="fNote">相談したいこと（任意）</label>
      <textarea id="fNote"></textarea>
    </div>
    <button class="btn" id="submitBtn" disabled>この内容で予約を確定する</button>
    <p class="note">予約確定後、ご入力いただいたメールアドレス宛にGoogle Meetの参加URLが届きます。届いたら、ご自身のGoogleアカウントにログインしてご登録・ご確認ください。</p>
    <p id="submitError" class="error-msg" style="display:none"></p>
  </div>

  <div id="confirmCard" class="card confirm-card" style="display:none"></div>
</div>

<script>
(function(){
  // TODO: バックエンドをデプロイしたら、実際のURLに置き換えてください（例: Cloud Run のURL）
  var API_BASE = "https://moyan-booking-backend-373262430575.asia-northeast1.run.app";
  // TODO: LINE Developers ConsoleでLIFFアプリを発行したら、そのLIFF IDに置き換えてください
  var LIFF_ID = "2011318904-tuhwTJNL";

  var params = new URLSearchParams(location.search);
  var type = params.get("type");

  var pickedStart = null;
  var pickedLabel = "";
  var liffProfile = null;

  function el(id){ return document.getElementById(id); }

  function tryInitLiff(){
    if (typeof liff === "undefined" || !LIFF_ID || LIFF_ID.indexOf("REPLACE") === 0) return;
    liff.init({ liffId: LIFF_ID }).then(function(){
      if (liff.isLoggedIn()) {
        return liff.getProfile().then(function(profile){
          liffProfile = profile;
          if (el("fName") && !el("fName").value) el("fName").value = profile.displayName || "";
        });
      }
    }).catch(function(err){
      console.warn("LIFF init skipped:", err);
    });
  }

  function fetchAvailability(){
    fetch(API_BASE + "/api/availability?type=" + encodeURIComponent(type) + "&days=14")
      .then(function(r){
        if (!r.ok) throw new Error("availability fetch failed: " + r.status);
        return r.json();
      })
      .then(renderService)
      .then(function(data){ renderSchedule(data); })
      .catch(function(err){
        el("serviceCard").innerHTML = '<p class="error-msg">空き状況の取得に失敗しました。時間をおいて再度お試しください。</p>';
        console.error(err);
      });
  }

  function renderService(data){
    var c = data.config;
    el("serviceCard").innerHTML =
      "<h2>" + c.label + "</h2>" +
      '<p class="svc-desc">ご希望の内容で承ります。</p>' +
      '<div class="price-row"><span>料金</span><b>' + c.priceLabel + "</b></div>" +
      '<div class="price-row"><span>時間</span><b>' + c.minutes + "分</b></div>";
    return data;
  }

  function renderTypeChooser(){
    el("serviceCard").innerHTML =
      "<h2>ご相談の内容を選んでください</h2>" +
      '<button class="btn" id="chooseProposal" style="margin-bottom:10px">具体的な提案がほしい（60分・9,000円）</button>' +
      '<button class="btn" id="chooseFollowup">前回の振り返りをしたい（90分・10,000円）</button>';
    el("chooseProposal").addEventListener("click", function(){ selectType("proposal"); });
    el("chooseFollowup").addEventListener("click", function(){ selectType("followup"); });
  }

  function selectType(t){
    type = t;
    fetchAvailability();
  }

  function renderSchedule(data){
    el("scheduleCard").style.display = "";
    var list = el("scheduleList");
    if (!data.days || !data.days.length){
      list.innerHTML = '<p class="state-msg">現在、空き枠が見つかりませんでした。少し先の日程で再度お試しください。</p>';
      return;
    }
    list.innerHTML = data.days.map(function(day, idx){
      var dateObj = new Date(day.date + "T00:00:00+09:00");
      var label = dateObj.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric", weekday: "short" });
      var slotsHtml = day.slots.map(function(slot, si){
        var t = new Date(slot.start).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });
        var id = "slot_" + idx + "_" + si;
        return '<div class="slot">' +
          '<input type="radio" name="slotChoice" id="' + id + '" value="' + slot.start + '" data-label="' + label + " " + t + '" />' +
          '<label for="' + id + '">' + t + "</label>" +
          "</div>";
      }).join("");
      return "<details" + (idx === 0 ? " open" : "") + ">" +
        "<summary><span>" + label + '</span><span class="cnt">' + day.slots.length + "件</span></summary>" +
        '<div class="slots">' + slotsHtml + "</div>" +
        "</details>";
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll('input[name="slotChoice"]'), function(input){
      input.addEventListener("change", function(){
        pickedStart = input.value;
        pickedLabel = input.getAttribute("data-label");
        el("formCard").style.display = "";
        updateSubmitState();
      });
    });
  }

  function updateSubmitState(){
    var ok = pickedStart && el("fName").value.trim() && el("fEmail").value.trim();
    el("submitBtn").disabled = !ok;
  }

  function submitBooking(){
    el("submitError").style.display = "none";
    el("submitBtn").disabled = true;
    el("submitBtn").textContent = "送信しています…";

    fetch(API_BASE + "/api/book", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: type,
        start: pickedStart,
        name: el("fName").value.trim(),
        email: el("fEmail").value.trim(),
        phone: el("fPhone").value.trim(),
        note: el("fNote").value.trim(),
        liffUserId: liffProfile ? liffProfile.userId : null
      })
    })
      .then(function(r){ return r.json().then(function(body){ return { ok: r.ok, body: body }; }); })
      .then(function(res){
        if (!res.ok) {
          var msg = res.body && res.body.error === "slot_taken"
            ? "選択した時間はちょうど埋まってしまったようです。お手数ですが別の時間を選び直してください。"
            : "予約の送信に失敗しました。時間をおいて再度お試しください。";
          throw new Error(msg);
        }
        showConfirmation(res.body);
      })
      .catch(function(err){
        el("submitError").textContent = err.message || "予約の送信に失敗しました。";
        el("submitError").style.display = "";
        el("submitBtn").disabled = false;
        el("submitBtn").textContent = "この内容で予約を確定する";
      });
  }

  function showConfirmation(result){
    el("scheduleCard").style.display = "none";
    el("formCard").style.display = "none";
    var meetHtml = result.meetLink
      ? '<a class="meet-link" href="' + result.meetLink + '" target="_blank" rel="noopener">Google Meetの参加URLを見る</a>'
      : "";
    el("confirmCard").style.display = "";
    el("confirmCard").innerHTML =
      "<h2>予約が完了しました</h2>" +
      "<p>" + pickedLabel + " でお待ちしております。</p>" +
      meetHtml +
      '<p class="note">Google MeetのURLが届いたら、ご自身のGoogleアカウントにログインしてご登録・ご確認ください。</p>';
  }

  ["fName", "fEmail"].forEach(function(id){
    el(id).addEventListener("input", updateSubmitState);
  });
  el("submitBtn").addEventListener("click", submitBooking);

  tryInitLiff();
  if (type) {
    fetchAvailability();
  } else {
    renderTypeChooser();
  }
})();
</script>
</body>
</html>
